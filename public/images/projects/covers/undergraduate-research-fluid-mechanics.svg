<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" role="img" aria-labelledby="title desc">
  <title id="title">Fluid mechanics and computational research concept illustration</title>
  <desc id="desc">A conceptual overview of signal processing, laboratory rheometry, and pulsatile fluid-pump experiments, shown as three connected pastel engineering modules. This is not research data or a photograph.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e7e9e5" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfb"/>
      <stop offset="1" stop-color="#f8f9f6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="875" fill="url(#paper)"/>
  <rect width="1400" height="875" fill="url(#grid)" opacity=".72"/>
  <text x="92" y="112" fill="#77817b" font-family="Arial, sans-serif" font-size="19" letter-spacing="5">UNDERGRADUATE RESEARCH</text>
  <text x="92" y="185" fill="#252b28" font-family="Arial, sans-serif" font-size="48" font-weight="500" letter-spacing="-2">signals · materials · fluid motion</text>
  <text x="94" y="224" fill="#737a74" font-family="Arial, sans-serif" font-size="18" letter-spacing="1">A conceptual overview · not experimental data</text>

