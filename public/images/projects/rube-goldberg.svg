<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#6b7c70" stroke-width="1"/></marker></defs><rect width="800" height="500" fill="#eeeae4"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="65" y="65" fill="#26352e" font-size="14" font-weight="500">Rube Goldberg / connected mechanisms</text><text x="65" y="89" fill="#53635a" font-size="11" font-weight="400">40 sections across the full collaborative build.</text><rect x="65" y="130" width="270" height="100" rx="12" fill="#ffffff" fill-opacity=".82" stroke="#6c7c6f" stroke-opacity=".2"/><text x="85" y="157" fill="#526252" font-size="10" font-weight="400">01</text><text x="85" y="184" fill="#26352e" font-size="19" font-weight="500">Ball input</text><text x="85" y="208" fill="#53635a" font-size="11" font-weight="400">Start of the illustrated sequence</text><rect x="465" y="130" width="270" height="100" rx="12" fill="#ffffff" fill-opacity=".82" stroke="#6c7c6f" stroke-opacity=".2"/><text x="485" y="157" fill="#526252" font-size="10" font-weight="400">02</text><text x="485" y="184" fill="#26352e" font-size="19" font-weight="500">Mechanism</text><text x="485" y="208" fill="#53635a" font-size="11" font-weight="400">Motion through a section</text><rect x="465" y="300" width="270" height="100" rx="12" fill="#ffffff" fill-opacity=".82" stroke="#6c7c6f" stroke-opacity=".2"/><text x="485" y="327" fill="#526252" font-size="10" font-weight="400">03</text><text x="485" y="354" fill="#26352e" font-size="19" font-weight="500">Transfer</text><text x="485" y="378" fill="#53635a" font-size="11" font-weight="400">Interface between sections</text><rect x="65" y="300" width="270" height="100" rx="12" fill="#ffffff" fill-opacity=".82" stroke="#6c7c6f" stroke-opacity=".2"/><text x="85" y="327" fill="#526252" font-size="10" font-weight="400">04</text><text x="85" y="354" fill="#